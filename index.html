<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наша карта</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="splash-heart">❤️</div>
  <div class="splash-text">История нашей любви</div>
</div>

<!-- Карта -->
<div id="map"></div>

<!-- Overlay и карточка -->
<div id="overlay"></div>
<div id="place-card">
  <button id="close-card">×</button>
  <h2 id="card-title"></h2>
  <div id="card-date"></div>
  <div id="card-slider">
    <button id="prev-photo">◀</button>
    <img id="card-photo"/>
    <button id="next-photo">▶</button>
  </div>
  <p id="card-text"></p>
</div>

<!-- Данные -->
<script src="photos_base64.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const splash = document.getElementById("splash");
    const mapDiv = document.getElementById("map");

    function formatDate(dateStr) {
        const months = [
            "января", "февраля", "марта", "апреля", "мая", "июня",
            "июля", "августа", "сентября", "октября", "ноября", "декабря"
        ];
        const parts = dateStr.split("-");
        const year = parts[0];
        const month = months[parseInt(parts[1], 10) - 1];
        const day = parseInt(parts[2], 10);
        return `${day} ${month} ${year}`;
    }

    function initializeMap(places) {
        const map = L.map('map').setView([59.9386, 30.3141], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '' }).addTo(map);
        const heartIcon = L.divIcon({ className: 'heart-icon', html: '❤️', iconSize: [30, 30] });

        places.forEach(place => {
            L.marker([place.lat, place.lng], { icon: heartIcon })
             .addTo(map)
             .on('click', () => openCard(place));
        });

        function openCard(place) {
            document.getElementById('card-title').textContent = place.title;
            document.getElementById('card-date').textContent = formatDate(place.date);
            document.getElementById('card-text').textContent = place.text || "";

            const slider = document.getElementById('card-slider');
            const imgEl = document.getElementById('card-photo');
            let index = 0;

            if(place.photos && place.photos.length > 0){
                slider.style.display = 'flex';
                imgEl.src = place.photos[index];

                document.getElementById('prev-photo').onclick = () => {
                    index = (index - 1 + place.photos.length) % place.photos.length;
                    imgEl.src = place.photos[index];
                };
                document.getElementById('next-photo').onclick = () => {
                    index = (index + 1) % place.photos.length;
                    imgEl.src = place.photos[index];
                };
            } else {
                slider.style.display = 'none';
            }

            document.getElementById('overlay').style.display='block';
            document.getElementById('place-card').style.display='block';
        }

        document.getElementById('close-card').onclick = () => {
            document.getElementById('overlay').style.display='none';
            document.getElementById('place-card').style.display='none';
        };
    }

    if (!localStorage.getItem("firstLaunchDone")) {
        splash.style.display = "flex";
        mapDiv.style.display = "none";
        setTimeout(()=>{
            splash.style.display="none";
            mapDiv.style.display="block";
            localStorage.setItem("firstLaunchDone","true");
            initializeMap(places);
        }, 2000);
    } else {
        splash.style.display="none";
        mapDiv.style.display="block";
        initializeMap(places);
    }
});
</script>

</body>
</html>
